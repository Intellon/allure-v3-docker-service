name: Allure Docker Service Workflow

on:
  push:
    tags:
      - v*

  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and publish (e.g. 3.3.1)'
        required: true
        default: '3.3.1'
        type: string
      tag_latest:
        description: 'Also tag as latest?'
        required: true
        default: true
        type: boolean
      create_release:
        description: 'Create GitHub Release?'
        required: true
        default: true
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: intellon/allure-docker-service
  ALLURE_RELEASE: 3.3.1

jobs:
  build_release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        ARCH: [amd64, arm64]
        include:
        - ARCH: amd64
          DOCKER_FILE: Dockerfile
          DOCKER_PLATFORM: linux/amd64

        - ARCH: arm64
          DOCKER_FILE: Dockerfile
          DOCKER_PLATFORM: linux/arm64

    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    outputs:
      build_version: ${{ steps.prepare.outputs.build_version }}
    steps:
      - name: Pulling code
        uses: actions/checkout@v4

      - name: Preparing
        id: prepare
        run: |
          echo "DOCKER BUILD: Build Docker image."
          echo "DOCKER BUILD: allure version -> ${ALLURE_RELEASE}."
          echo "DOCKER BUILD: docker file - ${{matrix.DOCKER_FILE}}."

          VERSION=na
          TAGS="--tag ${REGISTRY}/${IMAGE_NAME}:build --tag ${REGISTRY}/${IMAGE_NAME}:build-${{matrix.ARCH}}"

          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            if [[ $GITHUB_REF == *"beta"* ]]; then
                TAGS="--tag ${REGISTRY}/${IMAGE_NAME}:${VERSION} --tag ${REGISTRY}/${IMAGE_NAME}:${VERSION}-${{matrix.ARCH}} --tag ${REGISTRY}/${IMAGE_NAME}:beta --tag ${REGISTRY}/${IMAGE_NAME}:build-${{matrix.ARCH}}"
            else
                TAGS="--tag ${REGISTRY}/${IMAGE_NAME}:${VERSION} --tag ${REGISTRY}/${IMAGE_NAME}:${VERSION}-${{matrix.ARCH}} --tag ${REGISTRY}/${IMAGE_NAME}:latest --tag ${REGISTRY}/${IMAGE_NAME}:build-${{matrix.ARCH}}"
            fi
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION=${{ inputs.version }}
            if [[ "${{ inputs.tag_latest }}" == "true" ]]; then
                TAGS="--tag ${REGISTRY}/${IMAGE_NAME}:${VERSION} --tag ${REGISTRY}/${IMAGE_NAME}:${VERSION}-${{matrix.ARCH}} --tag ${REGISTRY}/${IMAGE_NAME}:latest --tag ${REGISTRY}/${IMAGE_NAME}:build-${{matrix.ARCH}}"
            else
                TAGS="--tag ${REGISTRY}/${IMAGE_NAME}:${VERSION} --tag ${REGISTRY}/${IMAGE_NAME}:${VERSION}-${{matrix.ARCH}} --tag ${REGISTRY}/${IMAGE_NAME}:build-${{matrix.ARCH}}"
            fi
          fi

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ALLURE_RELEASE=${{ inputs.version }}
          fi

          DOCKER_ARGS_STRING="\
            --build-arg BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ') \
            --build-arg BUILD_VERSION=${VERSION} \
            --build-arg BUILD_REF=${GITHUB_SHA::8} \
            --build-arg ALLURE_RELEASE=${ALLURE_RELEASE} \
            --platform ${{matrix.DOCKER_PLATFORM}} \
            ${TAGS} --file docker/Dockerfile ."

          echo "DOCKER BUILD: build version -> ${VERSION}."
          echo "build_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "docker_args=${DOCKER_ARGS_STRING}" >> $GITHUB_OUTPUT


      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: all

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Building
        run: |
          docker buildx build --no-cache ${{ steps.prepare.outputs.docker_args }} --load

      - name: Docker Testing
        run: |
          echo "DOCKER TEST: Test Docker image"
          echo "DOCKER TEST: testing image -> ${REGISTRY}/${IMAGE_NAME}:build-${{matrix.ARCH}}"

          docker run --platform ${{matrix.DOCKER_PLATFORM}} -d --rm --name=testing-${{matrix.ARCH}} ${REGISTRY}/${IMAGE_NAME}:build-${{matrix.ARCH}}
          if [ $? -ne 0 ]; then
            echo "DOCKER TEST: FAILED - Docker container testing failed to start."
            exit 1
          else
            echo "DOCKER TEST: PASSED - Docker container testing succeeded to start."
          fi

      - name: Login to GHCR
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${REGISTRY} -u ${{ github.actor }} --password-stdin

      - name: Docker Publishing
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: |
          echo "DOCKER PUSH: pushing - ${REGISTRY}/${IMAGE_NAME}:${{ steps.prepare.outputs.build_version }}-${{matrix.ARCH}}"
          docker push ${REGISTRY}/${IMAGE_NAME}:${{ steps.prepare.outputs.build_version }}-${{matrix.ARCH}}

      - name: Docker Logout
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: |
          docker logout ${REGISTRY}

  manifest_release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: build_release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${REGISTRY} -u ${{ github.actor }} --password-stdin

      - name: Docker Publishing Manifest
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: |
          BUILD_VERSION=${{ needs.build_release.outputs.build_version }}
          docker manifest create ${REGISTRY}/${IMAGE_NAME}:${BUILD_VERSION} \
              ${REGISTRY}/${IMAGE_NAME}:${BUILD_VERSION}-amd64 \
              ${REGISTRY}/${IMAGE_NAME}:${BUILD_VERSION}-arm64

          docker manifest annotate ${REGISTRY}/${IMAGE_NAME}:${BUILD_VERSION} ${REGISTRY}/${IMAGE_NAME}:${BUILD_VERSION}-arm64 --os=linux --arch=arm64 --variant=v8

          docker manifest push ${REGISTRY}/${IMAGE_NAME}:${BUILD_VERSION}

          TAG=beta
          if [[ ${BUILD_VERSION} != *"beta"* ]]; then
            TAG=latest
          fi

          docker manifest create ${REGISTRY}/${IMAGE_NAME}:${TAG} \
              ${REGISTRY}/${IMAGE_NAME}:${BUILD_VERSION}-amd64 \
              ${REGISTRY}/${IMAGE_NAME}:${BUILD_VERSION}-arm64

          docker manifest annotate ${REGISTRY}/${IMAGE_NAME}:${TAG} ${REGISTRY}/${IMAGE_NAME}:${BUILD_VERSION}-arm64 --os=linux --arch=arm64 --variant=v8

          docker manifest push ${REGISTRY}/${IMAGE_NAME}:${TAG}

      - name: Docker Logout
        if: success() && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
        run: |
          docker logout ${REGISTRY}

  github_release:
    runs-on: ubuntu-latest
    needs: [build_release, manifest_release]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    permissions:
      contents: write
    steps:
      - name: Pulling code
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BUILD_VERSION=${{ needs.build_release.outputs.build_version }}

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="v${BUILD_VERSION}"
            git tag "$TAG" || true
            git push origin "$TAG" || true
          else
            TAG=${GITHUB_REF#refs/tags/}
          fi

          PRERELEASE=""
          if [[ "$TAG" == *"beta"* ]]; then
            PRERELEASE="--prerelease"
          fi

          gh release create "$TAG" \
            --title "Allure Docker Service ${BUILD_VERSION}" \
            --notes "## Docker Image

          \`\`\`sh
          docker pull ${REGISTRY}/${IMAGE_NAME}:${BUILD_VERSION}
          \`\`\`

          **Allure Report:** ${BUILD_VERSION}
          **Architectures:** amd64, arm64
          **Registry:** \`${REGISTRY}/${IMAGE_NAME}\`" \
            $PRERELEASE \
            --verify-tag || true
